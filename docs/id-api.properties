# dbeaver-mm "Fetch IDs" ayarlari. Kaydet: C:\Users\<kullanici>\.dbeaver-mm\id-api.properties
# (Linux: ~/.dbeaver-mm/id-api.properties). Bu dosya varsa DBeaver API'yi kendisi cagirir, betik gerekmez.
# BURAYA-... yazan yerleri Postman'deki isteklerinden doldur. Kendi kullanici adin / sifren burada kalir,
# baskasiyla paylasma. Not: degerde ters bolu (\) varsa iki kez yaz (\\).

# --- 1) LOGIN istegi (POST) ---
login.url=https://BURAYA-LOGIN-URL
# JSON gonderiyorsan: application/json
login.contentType=application/x-www-form-urlencoded
login.body=BURAYA-LOGIN-BODY
# Login'in ek headerlari, her biri ayri satir: login.header.<Ad>=<deger>
#login.header.BURAYA-HEADER-ADI=BURAYA-HEADER-DEGERI
# Login yanitinda token'in bulundugu alan
token.field=access_token

# --- 2) GENERATE istegi ---
# {count} {table} {domain} DBeaver tarafindan doldurulur. Token "Authorization: Bearer ..." olarak eklenir.
generate.url=https://BURAYA-API-ADRESI/generate?count={count}&table={table}&domain={domain}
generate.method=GET
#generate.header.BURAYA-HEADER-ADI=BURAYA-HEADER-DEGERI
