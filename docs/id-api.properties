# dbeaver-mm Fetch IDs: API ayarlari. Bunu SEN bir kez doldurursun, kullanicilara elden verirsin.
# Nereye: dbeaver klasoru, dbeaver.exe'nin yani, adi tam olarak id-api.properties
#   (Windows zip'inde bu dosya zaten orada; yalnizca BURAYA-... yazan 3 yeri degistir).
# Kullanici yalnizca kendi kullanici adini ve sifresini girer: Plus Settings > ID API account...
# Bu dosyaya kimsenin sifresini yazma. Doldurulmus hali GitHub'a konmaz.

# 1) Login adresi
login.url=https://BURAYA-LOGIN-URL
# 2) Login govdesi: {user} ve {password} kullanicinin girdikleriyle doldurulur.
#    Alan adlari API'de farkliysa yalnizca onlari degistir (or. login={user}&pass={password})
login.body=username={user}&password={password}
# JSON bekleniyorsa: application/json ve body {"username":"{user}","password":"{password}"}
login.contentType=application/x-www-form-urlencoded
token.field=access_token
# 3) ID uretme adresi: {count} {table} {domain} DBeaver tarafindan doldurulur
generate.url=https://BURAYA-API-ADRESI/generate?count={count}&table={table}&domain={domain}
generate.method=GET

# Gerekirse ek headerlar, her biri ayri satir:
#login.header.Ad=deger
#generate.header.Ad=deger
