# dbeaver-mm: v* etiketi atilinca Windows zip'ini (icinde JRE ile) derleyip Releases'e koyar
name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: dbeaver
          fetch-depth: 0
          filter: blob:none

      # Sibling repos must match the upstream dbeaver commit the fork is based on, their devel moves on
      - name: Clone sibling repos
        run: |
          git -C dbeaver fetch -q --filter=blob:none https://github.com/dbeaver/dbeaver.git devel
          BASE_DATE=$(git -C dbeaver log -1 --format=%cI $(git -C dbeaver merge-base HEAD FETCH_HEAD))
          for repo in dbeaver-common datadam-api; do
            git clone -q --filter=blob:none -b devel https://github.com/dbeaver/$repo.git
            git -C $repo checkout -q $(git -C $repo rev-list -1 --before="$BASE_DATE" devel)
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          ./dbeaver-common/mvnw install \
            -Pproduct-dbeaver-ce,product-dbeaver-eclipse-ce \
            -T 1C -DskipTests \
            -Drepo.p2.dbeaver.version=26.2.1 \
            -f dbeaver/product/aggregate

      - name: Add JRE to Windows zip
        run: |
          mkdir pack && cd pack
          cp -r ../dbeaver/product/community/target/products/org.jkiss.dbeaver.core.product/win32/win32/x86_64/dbeaver .
          test -f dbeaver/dbeaver.exe
          curl -sL -o jre.zip "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          unzip -q jre.zip && rm jre.zip
          mv jdk-*-jre dbeaver/jre
          zip -qr ../dbeaver-mm-windows-x64.zip dbeaver

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF_NAME}
          [[ "$GITHUB_REF_TYPE" == tag ]] || TAG=nightly-$(date +%Y%m%d-%H%M)
          gh release create "$TAG" dbeaver-mm-windows-x64.zip \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "dbeaver-mm $TAG" \
            --notes "Windows: zip'i cikar, dbeaver klasorundeki dbeaver.exe'ye cift tikla. Java gerekmez."
